name: Release Keenetic binary

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SemVer tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must follow SemVer, for example v0.1.0 or v1.2.3-rc.1"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build linux/mipsle
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: mipsle
          GOMIPS: softfloat
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" \
            -o dist/xkeen-autoreload-vless-linux-mipsle ./cmd/xkeen-autoreload
          sha256sum dist/xkeen-autoreload-vless-linux-mipsle \
            > dist/xkeen-autoreload-vless-linux-mipsle.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/xkeen-autoreload-vless-linux-mipsle \
            dist/xkeen-autoreload-vless-linux-mipsle.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest
